name: CI

on:
  push:
    branches: [main, '**']
  pull_request:
    branches: [main]

jobs:
  client:
    name: Client Compile Check (Android targets = ${{ matrix.enable-android }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        enable-android: ['true', 'false']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Keep in sync with the Dockerfile (Node 24).
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'tiptap-bridge/package-lock.json'

      - name: Install tiptap-bridge dependencies
        run: |
          cd tiptap-bridge
          npm ci --legacy-peer-deps

      - name: Install Android compile SDK
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?Android SDK must be available on the runner}"
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          compile_sdk=$(sed -nE 's/^android-compileSdk[[:space:]]*=[[:space:]]*"([0-9]+)".*/\1/p' gradle/libs.versions.toml)
          test -n "$compile_sdk"
          if ! "$sdkmanager" "platforms;android-$compile_sdk" "platform-tools"; then
            "$sdkmanager" "platforms;android-$compile_sdk.0" "platform-tools"
          fi

      - uses: gradle/actions/setup-gradle@v6

      - name: Compile client
        # Always use the wrapper so CI runs the exact pinned Gradle version.
        run: >-
          ./gradlew :desktopApp:compileKotlin
          -PenableAndroid=${{ matrix.enable-android }}
          --no-daemon

      - name: Assemble Android debug APK
        if: matrix.enable-android == 'true'
        run: ./gradlew :androidApp:assembleDebug -PenableAndroid=true --no-daemon

  client-tests:
    name: Client JVM Tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [core, data-app, features]
        include:
          - shard: core
            modules: >-
              :core:common:jvmTest
              :core:database:jvmTest
              :core:navigation:jvmTest
              :core:network:jvmTest
              :core:contract:jvmTest
          - shard: data-app
            modules: >-
              :core:data:jvmTest
              :core:ui:jvmTest
              :composeApp:jvmTest
          - shard: features
            modules: >-
              :features:article:jvmTest
              :features:article-editor:jvmTest
              :features:auth:jvmTest
              :features:chat:jvmTest
              :features:conversations:jvmTest
              :features:profile:jvmTest
              :features:settings:jvmTest
    steps:
      - uses: actions/checkout@v7

      # jvmTest of article/article-editor/composeApp (and webApp compile)
      # pulls the tiptap webview Exec tasks into the graph, so Node and the
      # tiptap-bridge node_modules must exist even on a "pure JVM" test run.
      - uses: actions/setup-node@v7
        with:
          # Keep in sync with the other jobs (Node 24).
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'tiptap-bridge/package-lock.json'

      - name: Install tiptap-bridge dependencies
        run: |
          cd tiptap-bridge
          npm ci --legacy-peer-deps

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      - name: Run JVM tests
        run: >-
          ./gradlew ${{ matrix.modules }}
          -PenableAndroid=false
          --no-daemon

      # webApp is an entry module with no dependents: nothing else in the
      # graph compiles it, so it needs an explicit task here.
      - name: Compile webApp (wasmJs)
        if: matrix.shard == 'core'
        run: ./gradlew :webApp:compileKotlinWasmJs -PenableAndroid=false --no-daemon

  collab-server-check:
    name: Collab Server Dependency Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'collab-server/package-lock.json'

      - name: Install collab-server dependencies
        run: |
          cd collab-server
          npm ci --legacy-peer-deps

      - name: Syntax check
        run: node --check collab-server/index.js

  server:
    name: Server Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'tiptap-bridge/package-lock.json'

      - name: Install tiptap-bridge dependencies
        run: |
          cd tiptap-bridge
          npm ci --legacy-peer-deps

      - name: Install Android compile SDK
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?Android SDK must be available on the runner}"
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          compile_sdk=$(sed -nE 's/^android-compileSdk[[:space:]]*=[[:space:]]*"([0-9]+)".*/\1/p' gradle/libs.versions.toml)
          test -n "$compile_sdk"
          if ! "$sdkmanager" "platforms;android-$compile_sdk" "platform-tools"; then
            "$sdkmanager" "platforms;android-$compile_sdk.0" "platform-tools"
          fi

      - uses: gradle/actions/setup-gradle@v6

      - name: Run server and protocol tests
        run: ./gradlew :server:test :core:contract:jvmTest -PenableAndroid=true --no-daemon

      # The SPA is packaged into the shadow jar only — a test fixture serves
      # "/" in route tests — so assert the real packaging here, where a
      # misplaced `from(stageWebAssets)` cannot hide behind a green suite.
      - name: Assert the fat jar embeds the web SPA
        run: |
          ./gradlew :server:buildFatJar -PenableAndroid=true --no-daemon
          unzip -l server/build/libs/fat.jar | grep -q "static/index.html" || {
            echo "fat.jar is missing static/index.html — SPA packaging broke"
            exit 1
          }
