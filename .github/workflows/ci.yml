name: CI

on:
  push:
    branches: [main, '**']
  pull_request:
    branches: [main]

jobs:
  client:
    name: Client Compile Check (Android targets = ${{ matrix.enable-android }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        enable-android: ['true', 'false']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          # Keep in sync with the Dockerfile (Node 24).
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'tiptap-bridge/package-lock.json'

      - name: Install tiptap-bridge dependencies
        run: |
          cd tiptap-bridge
          npm ci --legacy-peer-deps

      - name: Install Android compile SDK
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?Android SDK must be available on the runner}"
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          compile_sdk=$(sed -nE 's/^android-compileSdk[[:space:]]*=[[:space:]]*"([0-9]+)".*/\1/p' gradle/libs.versions.toml)
          test -n "$compile_sdk"
          if ! "$sdkmanager" "platforms;android-$compile_sdk" "platform-tools"; then
            "$sdkmanager" "platforms;android-$compile_sdk.0" "platform-tools"
          fi

      - uses: gradle/actions/setup-gradle@v6

      - name: Compile client
        # Always use the wrapper so CI runs the exact pinned Gradle version.
        run: >-
          ./gradlew :desktopApp:compileKotlin
          -PenableAndroid=${{ matrix.enable-android }}
          --no-daemon

      - name: Assemble Android debug APK
        if: matrix.enable-android == 'true'
        run: ./gradlew :androidApp:assembleDebug -PenableAndroid=true --no-daemon

  collab-server-check:
    name: Collab Server Dependency Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'collab-server/package-lock.json'

      - name: Install collab-server dependencies
        run: |
          cd collab-server
          npm ci --legacy-peer-deps

      - name: Syntax check
        run: node --check collab-server/index.js

  server:
    name: Server Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'tiptap-bridge/package-lock.json'

      - name: Install tiptap-bridge dependencies
        run: |
          cd tiptap-bridge
          npm ci --legacy-peer-deps

      - name: Install Android compile SDK
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?Android SDK must be available on the runner}"
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          compile_sdk=$(sed -nE 's/^android-compileSdk[[:space:]]*=[[:space:]]*"([0-9]+)".*/\1/p' gradle/libs.versions.toml)
          test -n "$compile_sdk"
          if ! "$sdkmanager" "platforms;android-$compile_sdk" "platform-tools"; then
            "$sdkmanager" "platforms;android-$compile_sdk.0" "platform-tools"
          fi

      - uses: gradle/actions/setup-gradle@v6

      - name: Run server and protocol tests
        run: ./gradlew :server:test :core:network-api:jvmTest -PenableAndroid=true --no-daemon
