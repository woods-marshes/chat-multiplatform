components:
  schemas:
    LoginRequest:
      type: "object"
      properties:
        email:
          type: "string"
        password:
          type: "string"
      required:
        - "email"
        - "password"
    User:
      type: "object"
      properties:
        username:
          type: "string"
        email:
          type: "string"
          nullable: true
        displayName:
          type: "string"
          nullable: true
        avatarUrl:
          type: "string"
          nullable: true
        bio:
          type: "string"
          nullable: true
        role:
          type: "string"
          enum:
            - "ADMIN"
            - "MEMBER"
            - "GUEST"
            - "BOT"
      required:
        - "username"
        - "role"
    AuthResponse:
      type: "object"
      properties:
        user:
          $ref: "#/components/schemas/User"
        accessToken:
          type: "string"
      required:
        - "user"
        - "accessToken"
    RegisterRequest:
      type: "object"
      properties:
        username:
          type: "string"
        email:
          type: "string"
        password:
          type: "string"
      required:
        - "username"
        - "email"
        - "password"
    Pair:
      type: "object"
      properties: { }
    AddContactRequest:
      type: "object"
      properties:
        message:
          type: "string"
          nullable: true
    Map:
      type: "object"
      properties: { }
    Map_String:
      type: "string"
    UpdateContactRequest:
      type: "object"
      properties:
        nickname:
          type: "string"
          nullable: true
        alias:
          type: "string"
          nullable: true
    ContactRequest:
      type: "object"
      properties:
        message:
          type: "string"
          nullable: true
        status:
          type: "string"
          enum:
            - "PENDING"
            - "ACCEPTED"
            - "REJECTED"
            - "CANCELED"
      required:
        - "status"
    HandleContactRequest:
      type: "object"
      properties:
        action:
          type: "string"
          enum:
            - "APPROVE"
            - "REJECT"
            - "CANCEL"
        remark:
          type: "string"
          nullable: true
      required:
        - "action"
    CreateConversationRequest:
      type: "object"
      properties: { }
    ConversationMetadata:
      type: "object"
      properties: { }
    Conversation:
      type: "object"
      properties:
        type:
          type: "string"
          enum:
            - "GROUP"
            - "PRIVATE"
        metadata:
          nullable: true
          $ref: "#/components/schemas/ConversationMetadata"
      required:
        - "type"
    SimpleUser:
      type: "object"
      properties:
        username:
          type: "string"
        displayName:
          type: "string"
          nullable: true
        avatarUrl:
          type: "string"
          nullable: true
        role:
          type: "string"
          enum:
            - "ADMIN"
            - "MEMBER"
            - "GUEST"
            - "BOT"
      required:
        - "username"
        - "role"
    MessageContent:
      type: "object"
      properties: { }
    MessageSenderContext:
      type: "object"
      properties:
        conversationRole:
          type: "string"
          enum:
            - "OWNER"
            - "ADMIN"
            - "MEMBER"
            - "PARTICIPANT"
            - "UNKNOWN"
        bubbleColor:
          type: "string"
          nullable: true
      required:
        - "conversationRole"
    SimpleMessage:
      type: "object"
      properties:
        sender:
          nullable: true
          $ref: "#/components/schemas/SimpleUser"
        category:
          type: "string"
          enum:
            - "NORMAL"
            - "SYSTEM"
        content:
          $ref: "#/components/schemas/MessageContent"
        senderContext:
          nullable: true
          $ref: "#/components/schemas/MessageSenderContext"
      required:
        - "category"
        - "content"
    ParticipantSettings:
      type: "object"
      properties:
        nickname:
          type: "string"
          nullable: true
        alias:
          type: "string"
          nullable: true
        backgroundImage:
          type: "string"
          nullable: true
        enableNotification:
          type: "boolean"
        bubbleColor:
          type: "string"
          nullable: true
      required:
        - "enableNotification"
    ConversationParticipant:
      type: "object"
      properties:
        role:
          type: "string"
          enum:
            - "OWNER"
            - "ADMIN"
            - "MEMBER"
            - "PARTICIPANT"
            - "UNKNOWN"
        settings:
          $ref: "#/components/schemas/ParticipantSettings"
      required:
        - "role"
        - "settings"
    ConversationInfo:
      type: "object"
      properties: { }
    ConversationResponse:
      type: "object"
      properties:
        type:
          type: "string"
          enum:
            - "GROUP"
            - "PRIVATE"
        lastMessage:
          nullable: true
          $ref: "#/components/schemas/SimpleMessage"
        metadata:
          nullable: true
          $ref: "#/components/schemas/ConversationMetadata"
        participant:
          $ref: "#/components/schemas/ConversationParticipant"
        conversationInfo:
          $ref: "#/components/schemas/ConversationInfo"
      required:
        - "type"
        - "participant"
        - "conversationInfo"
    InviteUserRequest:
      type: "object"
      properties: { }
    InviteUsersRequest:
      type: "object"
      properties: { }
    JoinGroupRequest:
      type: "object"
      properties:
        message:
          type: "string"
          nullable: true
    Unit:
      type: "object"
      properties: { }
    Message:
      type: "object"
      properties:
        sender:
          nullable: true
          $ref: "#/components/schemas/SimpleUser"
        category:
          type: "string"
          enum:
            - "NORMAL"
            - "SYSTEM"
        replyTo:
          nullable: true
          $ref: "#/components/schemas/Message"
        content:
          $ref: "#/components/schemas/MessageContent"
        senderContext:
          nullable: true
          $ref: "#/components/schemas/MessageSenderContext"
      required:
        - "category"
        - "content"
    ReadReportRequest:
      type: "object"
      properties: { }
    GroupSettings:
      type: "object"
      properties:
        joinApprovalRequired:
          type: "boolean"
        allowMemberInvite:
          type: "boolean"
        allowBotJoin:
          type: "boolean"
        muteAll:
          type: "boolean"
      required:
        - "joinApprovalRequired"
        - "allowMemberInvite"
        - "allowBotJoin"
        - "muteAll"
    UpdateConversationSettingsRequest:
      type: "object"
      properties:
        name:
          type: "string"
          nullable: true
        handle:
          type: "string"
          nullable: true
        description:
          type: "string"
          nullable: true
        avatarUrl:
          type: "string"
          nullable: true
        settings:
          nullable: true
          $ref: "#/components/schemas/GroupSettings"
    GroupGroupJoinRequest:
      type: "object"
      properties:
        message:
          type: "string"
          nullable: true
        status:
          type: "string"
          enum:
            - "PENDING"
            - "ACCEPTED"
            - "REJECTED"
            - "CANCELED"
      required:
        - "status"
    HandleGroupRequest:
      type: "object"
      properties:
        action:
          type: "string"
          enum:
            - "APPROVE"
            - "REJECT"
        reason:
          type: "string"
          nullable: true
      required:
        - "action"
    GroupProfile:
      type: "object"
      properties:
        name:
          type: "string"
        handle:
          type: "string"
          nullable: true
        description:
          type: "string"
          nullable: true
        avatarUrl:
          type: "string"
          nullable: true
        settings:
          $ref: "#/components/schemas/GroupSettings"
      required:
        - "name"
        - "settings"
    ChangeRoleRequest:
      type: "object"
      properties:
        newRole:
          type: "string"
          enum:
            - "ADMIN"
            - "MEMBER"
            - "GUEST"
            - "BOT"
      required:
        - "newRole"
    UpdateProfileRequest:
      type: "object"
      properties:
        displayName:
          type: "string"
          nullable: true
        avatarUrl:
          type: "string"
          nullable: true
        bio:
          type: "string"
          nullable: true
    PrivacySetting:
      type: "object"
      properties:
        allowSearch:
          type: "boolean"
        friendRequestPolicy:
          type: "string"
          enum:
            - "NEED_APPROVAL"
            - "AUTO_ACCEPT"
            - "DENY_ANY"
        showOnlineStatus:
          type: "boolean"
        profileVisibility:
          type: "string"
          enum:
            - "PUBLIC"
            - "FRIENDS"
            - "PRIVATE"
        allowStrangerChat:
          type: "boolean"
      required:
        - "allowSearch"
        - "friendRequestPolicy"
        - "showOnlineStatus"
        - "profileVisibility"
        - "allowStrangerChat"
    UserPreference:
      type: "object"
      properties:
        themeMode:
          type: "string"
          default: "SYSTEM"
        notificationSound:
          type: "boolean"
      required:
        - "themeMode"
        - "notificationSound"
    UserSetting:
      type: "object"
      properties:
        privacy:
          $ref: "#/components/schemas/PrivacySetting"
        preferences:
          $ref: "#/components/schemas/UserPreference"
      required:
        - "privacy"
        - "preferences"
    UpdateUserSettingsRequest:
      type: "object"
      properties:
        privacy:
          nullable: true
          $ref: "#/components/schemas/PrivacySetting"
        preferences:
          nullable: true
          $ref: "#/components/schemas/UserPreference"