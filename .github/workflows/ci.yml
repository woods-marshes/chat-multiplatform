name: CI

on:
  push:
    branches: [main, '**']
  pull_request:
    branches: [main, '**']

jobs:
  client:
    name: Client Compile Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'tiptap-bridge/package-lock.json'

      - name: Install tiptap-bridge dependencies
        run: |
          cd tiptap-bridge
          npm install --legacy-peer-deps

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Compile client
        run: gradle :composeApp:jvmMainClasses --no-daemon

  collab-server-check:
    name: Collab Server Dependency Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'collab-server/package-lock.json'

      - name: Install collab-server dependencies
        run: |
          cd collab-server
          npm ci --legacy-peer-deps

  server:
    name: Server Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'tiptap-bridge/package-lock.json'

      - name: Install tiptap-bridge dependencies
        run: |
          cd tiptap-bridge
          npm install --legacy-peer-deps

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Run server tests
        run: gradle :server:test --no-daemon
