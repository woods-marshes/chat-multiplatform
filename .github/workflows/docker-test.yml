name: Docker Test

on:
  push:
    branches: [main, '**']
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/chat-server
  COLLAB_IMAGE_NAME: ghcr.io/${{ github.repository }}/chat-collab-server

jobs:
  test-build-ktor:
    name: Test Build Ktor Server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Test Build Ktor (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          tags: ${{ env.IMAGE_NAME }}:test

  test-build-collab:
    name: Test Build Collab Server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Test Build Collab (no push)
        uses: docker/build-push-action@v7
        with:
          context: ./collab-server
          file: ./collab-server/Dockerfile
          push: false
          tags: ${{ env.COLLAB_IMAGE_NAME }}:test
